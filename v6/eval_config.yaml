# v6 evaluation configuration.
#
# Model and judge names live here rather than in code, per the spec. Credentials never do:
# every provider reads its key from the environment (.env is loaded into it at import).
#
# Anything that affects what a model is asked — prompt files, seeds, option sets — is recorded
# in each output record, so a score can be traced back to the exact request that produced it.

dataset:
  # The transcripts the VM rendered the audio from. The eval is keyed to this file; pointing it
  # at pairs.json would score audio against text that was never spoken.
  transcripts: out/transcripts.json

  # The variable here is where the vocalization clip came from, not who rendered the audio.
  # All the speech is ElevenLabs in both sets, cut from the same takes — turns 1 to 4 and the
  # words of turn 5 are the same samples throughout. Only the clip spliced into turn 5 differs,
  # which is what makes a difference between these two attributable to the sound itself rather
  # than to voice, pacing or overall audio quality.
  renderers:
    elevenlabs:
      audio_root: out/audio/elevenlabs
      audio_path_template: "{item_id}__{condition}.mp3"
      notes: >
        Every clip cut from ElevenLabs' own tagged take of turn 5. eleven_v3, two stock voices,
        stability 0.30.
    dia_voc:
      audio_root: out/audio/dia_voc
      audio_path_template: "{item_id}__{condition}.mp3"
      notes: >
        The same ElevenLabs speech, with the gasp and groan clips replaced by Dia ones.
        ElevenLabs' gasps and groans were judged inadequate by listening, so those two sounds
        come from Dia, voice-cloned from reference/ElevenLabs_ref.mp3 so each clip sits in the
        same voice as the speech around it. Laughs and sighs are unchanged. Clip source is
        therefore confounded with which vocalization it is — Dia supplies only two of the four
        — so a difference between these sets says gasp and groan changed, not that Dia clips
        are better.
  # Used when a command is not told which renderer to work on.
  default_renderer: elevenlabs

  # The conditions a response is elicited for, and so the only ones content and tone are scored
  # on. The baseline is excluded: with no vocalization there is nothing for a response to be
  # appropriate *to*, so nearly any sensible reply fits it and the score measures fluency
  # instead. It remains in perception — where it is the false-positive test — and in pragmatic.
  response_conditions: [condition_a, condition_b]

# One seed governs every deterministic draw: option order, correct-answer position, paired-trial
# candidate order. Changing it reshuffles the frozen task set, so it changes the benchmark.
seed: 20260902

# The six answerable perception labels. `none` is a normal option, not a special case.
inventory: [laugh, sigh, gasp, groan, scream, none]

writers:
  # Rubrics are written by Claude per the spec. `transport: cli` bills the subscription through
  # the claude CLI; `transport: api` uses ANTHROPIC_API_KEY instead.
  rubric: {model: claude-opus-5, transport: cli}
  # The pragmatic multiple-choice options are written by a different family from the rubrics, so
  # a distractor differs from the correct answer in substance rather than in one model's style.
  pragmatic: {model: gpt-5.6-sol, effort: high}
  # Checks that each speaker stays the same person across a transcript's five turns. A different
  # family from the writer on purpose: a model asked to find the fault in its own prose tends to
  # explain why it is not a fault.
  verifier: {model: claude-opus-5, transport: cli}

# Token prices, USD per 1M tokens, so a run can report what it cost instead of only how many
# tokens it used. Only the OpenAI models need this: the Claude CLI returns `total_cost_usd` with
# every reply and that figure is used directly, while the OpenAI Responses API returns token
# counts and no cost at all. A model with no entry here is reported as tokens only rather than
# priced from a guess.
#
# `reasoning` tokens are already counted inside `output`, so they are billed at the output rate
# and must not be added again. `long_context_threshold` is the input size above which the higher
# tier applies — set from the vendor's own table if it differs; every call this pipeline makes is
# a few thousand tokens, so the short tier is what it actually pays.
pricing:
  long_context_threshold: 128000
  models:
    gpt-5.6-terra:
      short: {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 12.00}
      long:  {input: 4.00, cached_input: 0.40, cache_write: 5.00, output: 18.00}
    gpt-5.6-sol:
      short: {input: 4.00, cached_input: 0.40, cache_write: 5.00, output: 20.00}
      long:  {input: 8.00, cached_input: 0.80, cache_write: 10.00, output: 30.00}

# The systems under test. Each is a speech-to-speech model reached over realtime websockets by
# providers.py, at its own default effort — 2.0's convention, kept.
evaluated_models:
  - {id: openai, provider: openai, model: gpt-realtime-2.1}
  - {id: grok,   provider: grok,   model: grok-voice-think-fast-2.0}
  - {id: gemini, provider: gemini, model: gemini-3.1-flash-live-preview}
  - {id: qwen,   provider: qwen,   model: qwen-audio-3.0-realtime-plus}

judges:
  # Text judges: three families, one judgement each, majority carries it. Vendor diversity is
  # the point — a panel drawn from one family agrees with itself.
  text:
    - {id: opus,  provider: anthropic, model: claude-opus-5, transport: cli}
    - {id: gpt,   provider: openai,    model: gpt-5.6-sol}
    - {id: grok,  provider: grok,      model: grok-4.6}
  # Audio judges for tone. Two, because the rubric is a list of things a judge should be
  # confident about: agreement scores it, disagreement goes to a human rather than to 0.5.
  audio:
    - {id: gpt-audio,    provider: openai, model: gpt-4o-audio-preview}
    - {id: gemini-audio, provider: gemini, model: gemini-2.5-pro}
  # 2.0 found that a model rating its own reply is a conflict blinding does not remove, and
  # scored its tone panel leave-one-out instead. Kept as the default.
  audio_leave_one_out: true

paired:
  # A swapped-position duplicate measures position bias and doubles the paired stage, which is
  # already over half the judging budget. Off by default; turn it on for a bias audit.
  swap_duplicate: false
  # What to do when four judges split 2-2. `individual` keeps every binary judgement in the
  # primary analysis and reports the 2-2 rate separately, which is the spec's recommendation.
  # `half` scores the aggregated item 0.5. `unresolved` drops it from the denominator.
  tie_policy: individual

scoring:
  bootstrap_resamples: 2000
  confidence: 0.95
