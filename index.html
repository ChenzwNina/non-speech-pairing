<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Non-speech vocalization evals</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #1c1712;
      --mute: #6d6458;
      --line: #d8cfc0;
      --card: #fbf8f2;
      --ok: #215c40;
      --miss: #9a3124;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
    body {
      font: 15px/1.45 "Avenir Next", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    h1, .serif { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
    .hub {
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .hub-inner { max-width: 1120px; margin: 0 auto; padding: 18px 20px 0; }
    .kicker {
      margin: 0 0 4px;
      color: var(--mute);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
    }
    h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
    .intro { margin: 6px 0 14px; color: var(--mute); max-width: 54em; }
    .tabs { display: flex; gap: 0; }
    .tabs button {
      font: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-bottom: 0;
      padding: 10px 16px;
      cursor: pointer;
      color: var(--mute);
      text-align: left;
      max-width: 50%;
    }
    .tabs button + button { border-left: 0; }
    .tabs button.on { background: var(--card); color: var(--ink); }
    .tabs .num {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 2px;
    }
    .tabs .name { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 16px; }
    .tabs .score { font-size: 12px; color: var(--mute); margin-top: 2px; }
    .blurb {
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom: 0;
      padding: 14px 16px 16px;
      margin-bottom: -1px;
    }
    .blurb h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .blurb p { margin: 0; color: var(--mute); max-width: 62em; }
    .blurb strong { color: var(--ink); font-weight: 600; }
    .frame-wrap { flex: 1 1 auto; min-height: 0; background: var(--card); }
    iframe { width: 100%; height: 100%; border: 0; background: var(--paper); }
    @media (max-width: 820px) {
      .tabs { flex-direction: column; }
      .tabs button { max-width: none; border-left: 1px solid var(--line); }
      .tabs button + button { border-left: 1px solid var(--line); border-top: 0; }
    }
  </style>
</head>
<body>
  <div class="hub">
    <div class="hub-inner">
      <p class="kicker">Non-speech vocalization probes</p>
      <h1>Does the model use the sound, or just the words?</h1>
      <p class="intro">Two listening tests. Same idea: keep the words controlled and see whether a realtime model uses laughs, groans, sighs, and similar sounds.</p>
      <div class="tabs">
        <button type="button" id="tab-attitude" data-tab="attitude">
          <span class="num">Task 1</span>
          <span class="name">Same words, different vocalization</span>
          <span class="score">What attitude is this? · 52% vs 25% chance</span>
        </button>
        <button type="button" id="tab-next" data-tab="next">
          <span class="num">Task 2</span>
          <span class="name">Hear the vocalization, predict the next line</span>
          <span class="score">What will Speaker A say? · 80% vs 50% chance</span>
        </button>
      </div>
      <div class="blurb" id="blurb"></div>
    </div>
  </div>
  <div class="frame-wrap">
    <iframe id="frame" title="Eval viewer"></iframe>
  </div>
  <script>
    const TABS = {
      attitude: {
        src: "web/v1/index.html",
        title: "Same words, different vocalization",
        html: `<h2>Task 1 · Same words, different vocalization → what attitude is this?</h2>
          <p>3-person mini-dialogues. Turns 1–2 are identical except Speaker B’s vocalization on Turn 2
          (enjoyment laugh vs impatient groan vs exhausted sigh vs relief sigh vs mm-hm).
          4-way MCQ on B’s attitude. Sewn clips: Turn 1 + clipped voc + Turn 2 speech.
          <strong>gpt-realtime: 25/48 = 52%</strong> (chance 25%).
          Impatience almost never lands (2/18). Enjoyment vs exhaustion is the strongest contrast (75%).</p>`
      },
      next: {
        src: "web/v2/index.html",
        title: "Hear the vocalization, predict the next line",
        html: `<h2>Task 2 · Hear the vocalization → predict the next line</h2>
          <p>Speaker A starts Turn 3 with a voc (sigh, groan, laugh, hmm, mm-hm, scoff, throat clear, exhale, yawn, shaky breath).
          The model hears Turn 1 + Turn 2 + the clipped voc only (no gold words) and picks A’s next line vs the opposite stance.
          <strong>gpt-realtime-2.1: 24/30 = 80%</strong> (chance 50%).
          Exhale 0/3, throat-clear 1/3; most others 3/3.</p>`
      }
    };

    const frame = document.getElementById("frame");
    const blurb = document.getElementById("blurb");
    const buttons = {
      attitude: document.getElementById("tab-attitude"),
      next: document.getElementById("tab-next")
    };

    function currentTab() {
      const hash = (location.hash || "").replace(/^#/, "");
      return TABS[hash] ? hash : "attitude";
    }

    function show(id) {
      const tab = TABS[id];
      Object.entries(buttons).forEach(([key, btn]) => btn.classList.toggle("on", key === id));
      blurb.innerHTML = tab.html;
      if (frame.dataset.tab !== id) {
        frame.dataset.tab = id;
        frame.title = tab.title;
        frame.src = tab.src;
      }
      document.title = tab.title + " · non-speech evals";
    }

    Object.entries(buttons).forEach(([id, btn]) => {
      btn.addEventListener("click", () => {
        if (location.hash.replace(/^#/, "") === id) show(id);
        else location.hash = id;
      });
    });
    window.addEventListener("hashchange", () => show(currentTab()));
    if (!location.hash) location.replace("#attitude");
    else show(currentTab());
  </script>
</body>
</html>
